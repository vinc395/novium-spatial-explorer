[workspace]
members = [
  "crates/xenium-core",
  "crates/xenium-io",
  "crates/xenium-index",
  "crates/xenium-score",
  "crates/xenium-server",
  "crates/xenium-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.88"

[profile.release]
debug = 1
lto = "thin"

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.clippy]
# Style lint only; `chunks_exact` is kept for readability of the record decoders.
chunks_exact_to_as_chunks = "allow"
