[package]
name = "xenium-cli"
description = "xenium-web command line: synth, inspect, ingest, validate, serve"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "xenium-web"
path = "src/main.rs"

[dependencies]
xenium-core = { path = "../xenium-core" }
xenium-io = { path = "../xenium-io" }
xenium-index = { path = "../xenium-index" }
xenium-server = { path = "../xenium-server" }
xenium-score = { path = "../xenium-score" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
pem = "4"
ring = "0.17"
time = "0.3"
x509-parser = { version = "0.18", features = ["verify"] }
rayon = "1.12"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
