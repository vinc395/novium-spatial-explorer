[package]
name = "xenium-score"
description = "Gene-signature scoring (UCell) over xenium-web section indexes"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
xenium-core = { path = "../xenium-core" }
xenium-index = { path = "../xenium-index" }
anyhow = "1.0"
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
xenium-io = { path = "../xenium-io" }
bytes = "1"

[lints]
workspace = true
