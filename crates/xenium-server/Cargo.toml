[package]
name = "xenium-server"
description = "Axum HTTP server for xenium-web indexes and the static web UI"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
xenium-core = { path = "../xenium-core" }
xenium-index = { path = "../xenium-index" }
xenium-score = { path = "../xenium-score" }
rayon = "1.12"
anyhow = "1.0"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
subtle = "2.6"
# PBKDF2 for per-person passwords (already in the build through rustls)
ring = "0.17"
bytes = "1"
lru = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.4"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "fs", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "set-header", "trace", "limit"] }
tracing = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
xenium-io = { path = "../xenium-io" }

[lints]
workspace = true
